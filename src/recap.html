<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>provenance recap</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--border:#d0d7de;--card:#f6f8fa;--night:rgba(31,35,40,.05);--sel:#ddf4ff;--merged:#1a7f37;--closed:#cf222e;--running:#0969da;--needs:#9a6700;--open:#8c959f;--accent:#0969da;--lab:380px;--gut:76px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--border:#30363d;--card:#161b22;--night:rgba(255,255,255,.04);--sel:#1c2b3f;--merged:#3fb950;--closed:#f85149;--running:#58a6ff;--needs:#d29922;--open:#6e7681;--accent:#58a6ff}}
@media (max-width:720px){:root{--lab:190px;--gut:56px}}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;margin:0 6px 0 0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:none;font-family:inherit}
.chip b{color:var(--fg)}
button.chip{cursor:pointer;border-color:var(--needs);color:var(--needs)}
button.chip.quiet{border-color:var(--border);border-style:dashed;color:var(--muted)}
.chart{border:1px solid var(--border);border-radius:6px;position:relative;overflow:hidden}
.axis,.row{display:grid;grid-template-columns:var(--lab) 1fr var(--gut)}
.axis{height:28px;border-bottom:1px solid var(--border);position:relative;z-index:1}
.ticks{position:relative}
.tick{position:absolute;top:7px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tick.we{opacity:.55}
.row{height:40px;border-bottom:1px solid color-mix(in srgb,var(--border) 45%,transparent);cursor:pointer;position:relative;z-index:1}
.row:hover .lab{background:color-mix(in srgb,var(--sel) 55%,transparent)}
.row.sel .lab{background:var(--sel);box-shadow:inset 3px 0 var(--accent)}
.row.sel .lane{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.lab{padding:4px 10px;min-width:0;overflow:hidden}
.l1,.l2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.l2{font-size:11px;color:var(--muted)}
.l1{font-weight:500}
.pre{color:var(--muted);font-weight:400}
.l2 .ref{font-size:11px;margin:0}
.sec{position:relative;z-index:1;display:flex;align-items:baseline;gap:8px;height:34px;padding:12px 10px 0;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg)}
.sec .m{font-weight:400;text-transform:none;letter-spacing:0}
.sec.needs{color:var(--needs)}
.sec .h{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px;margin-left:4px}
.note{position:absolute;top:2px;left:12px;font-size:10px;color:var(--muted);white-space:nowrap}
.more{position:relative;z-index:1;display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid var(--border);background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer}
.chip.needs{border-color:var(--needs);color:var(--needs)}
.chip.needs b{color:inherit}
.chip.ok{border-color:var(--merged);color:var(--merged)}
.chip.snap{border-color:var(--needs);color:var(--fg);background:color-mix(in srgb,var(--needs) 14%,transparent)}
.sec .m button{all:unset;color:var(--accent);cursor:pointer;margin-left:6px}
.sec .m button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{height:28px;padding:9px 10px 0;font-size:12px;font-weight:600;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .m{font-weight:400;color:var(--muted);margin-left:6px}
.lane{position:relative}
.bg{position:absolute;top:0;bottom:0;left:var(--lab);right:var(--gut);pointer-events:none}
.night{position:absolute;top:0;bottom:0;background:var(--night)}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--border) 75%,transparent)}
.now{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);z-index:2}
.gh{font-size:11px;font-weight:600;color:var(--accent);text-align:right;padding:7px 10px 0;white-space:nowrap}
/* Marks on a lane: ○ opened, a bar until the last activity, ● last activity,
   dots while nothing happens, a ✓ or ✗ disc when it ends, ◀ opened earlier. */
.span{position:absolute;top:17px;height:6px;border-radius:3px;background:var(--c)}
.tail{position:absolute;top:19px;border-top:2px dotted color-mix(in srgb,var(--open) 85%,transparent)}
.pt{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--c);background:var(--bg)}
.pt.fill{background:var(--c);box-shadow:0 0 0 2px var(--bg)}
.pt.end{top:12px;width:16px;height:16px;border:0;background:var(--c);box-shadow:0 0 0 2px var(--bg);color:var(--bg);font-size:10px;font-weight:900;display:grid;place-items:center}
.carry{position:absolute;top:14px;left:0;border:6px solid transparent;border-right:8px solid var(--c);border-left:0}
.carry.dim{border-right-color:var(--open);opacity:.7}
.gut{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.gut.c{color:var(--c)}.gut.long{color:var(--needs)}
.g{display:inline-block;position:relative;width:22px;height:12px;vertical-align:middle}
.g .span{top:3px}.g .tail{top:5px}.g .pt{top:0}.g .pt.end{top:-2px}.g .carry{top:0}
.merged{--c:var(--merged)}.closed{--c:var(--closed)}.running{--c:var(--running)}.needs{--c:var(--needs)}.open,.stale{--c:var(--open)}
.st{color:var(--c)}
.st.merged,.st.closed,.st.open{color:var(--muted)}
.m{color:var(--muted)}
.panel{position:relative;z-index:3;background:var(--bg);border-bottom:1px solid var(--border);box-shadow:inset 3px 0 var(--accent);padding:12px 16px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;cursor:default}
.panel h2{margin:0;font-size:14px}
.panel .m{font-size:12px}
.info{display:flex;flex-direction:column;gap:6px;min-width:0}
.said{margin:2px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:10.5em;overflow:auto;border-left:3px solid var(--needs);background:var(--card);border-radius:0 6px 6px 0;padding:6px 10px;font-size:12.5px}
.said-h{font-size:11px;font-weight:600;color:var(--needs)}
.acts{display:flex;flex-direction:column;gap:6px;align-self:start}
.sub{position:relative;z-index:1;padding:8px 10px 4px;font-size:11px;color:var(--muted);background:var(--bg);border-bottom:1px solid color-mix(in srgb,var(--border) 45%,transparent)}
.btn{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer;text-align:left;text-decoration:none}
code{font-family:var(--mono);font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend .g{margin-right:4px}
.foot{font-size:11px;color:var(--muted);margin-top:6px}
.empty{padding:24px;color:var(--muted)}
</style>
</head>
<body>
<div class="top"><h1 id="title"></h1><div class="seg" id="win"></div><div class="seg" id="grp"><button data-v="pr" class="on">By PR</button><button data-v="session">By session</button></div></div>
<div class="sum" id="sum"></div>
<div class="chart" id="chart"></div>
<div class="legend" id="legend"></div>
<div class="foot" id="foot"></div>
<script>
"use strict";
const D=/*DATA*/null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=36e5,DAY=24*H;
const NOW=new Date(D.generated_at),OPENED=new Date(),START=new Date(D.start),TODAY=new Date(D.today);
// Local calendar arithmetic: days and hours are counted on the clock, so a
// day with a clock change still ends at midnight and ticks stay on the hour.
const at=(d,days,h,m=0)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+days,h,m);
const floorHour=d=>at(d,0,d.getHours());
const ceilHour=d=>{const f=floorHour(d);return f<d?at(f,0,f.getHours()+1):f};
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const when=d=>{const days=Math.round((new Date(NOW.toDateString())-new Date(d.toDateString()))/DAY);
  return days===0?hm(d):days>0&&days<7?`${DN[d.getDay()]} ${hm(d)}`:`${d.getDate()} ${MN[d.getMonth()]}${d.getFullYear()!==NOW.getFullYear()?" "+d.getFullYear():""}`};
const full=d=>`${DN[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]} ${hm(d)}`;
const dur=(a,b)=>{let m=Math.max(0,Math.round((b-a)/6e4)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);m%=60;
  return d?(h?`${d}d ${h}h`:`${d}d`):h?(m?`${h}h${String(m).padStart(2,"0")}m`:`${h}h`):`${m}m`};
const E=D.entries.map(e=>{const end=e.state==="merged"?(e.merged_at||e.closed_at):e.state==="closed"?e.closed_at:null;
  return {...e,key:`${e.repo}#${e.number}`,o:new Date(e.created_at),c:end?new Date(end):null}});
const names={};for(const e of E){const n=e.repo.split("/").pop();(names[n]=names[n]||new Set).add(e.repo)}
const short=e=>{const n=e.repo.split("/").pop();return `${names[n].size===1?n:e.repo}#${e.number}`};
const idle=e=>NOW-new Date(e.last_activity);
// Moving: its agent is running, or something happened on it in the last hour.
const moving=e=>e.status==="running"||idle(e)<H;
const kind=e=>e.state!=="open"?e.state:e.group==="quiet"?"stale":e.group==="needs-you"?"needs":moving(e)?"running":"open";
const fresh=e=>e.group==="needs-you"&&!e.old_ask;
const sessionKey=e=>e.agent?`${e.agent.harness}/${e.agent.session_id}`:"";
let win=D.days>1?"window":"today",grp="pr",showQuiet=false;
// A page opened an hour or more after it was made says so: its status is old.
// Its title says "Today" only on the day it was made.
const STALE=OPENED-NOW>=H,DAYNAME=`${DN[NOW.getDay()]} ${NOW.getDate()} ${MN[NOW.getMonth()]}`;
// Sections whose full list is shown: "old" (asks), "done", "open", "quiet".
const expanded=new Set();
let sel=(E.find(fresh)||{}).key;

const winBtns=document.getElementById("win");
if(D.days>1){winBtns.innerHTML=`<button data-v="today">Today</button><button data-v="window" class="on">${esc(D.days)} days</button>`}else winBtns.remove();
document.getElementById("foot").innerHTML=`Generated by <code>provenance recap --html</code> at ${esc(full(NOW))}, in your browser's time zone. Status is a snapshot: run <code>provenance recap</code> for live status.`;

function inWindow(e){return win==="window"||e.state==="open"||e.c>=TODAY}
function rows(){return E.filter(e=>inWindow(e)&&(showQuiet||e.group!=="quiet"))}
// The axis ends at now: idle time has its own column after it.
function range(list){
  let a=START;
  if(win==="today"){a=at(TODAY,0,8);
    for(const e of list){const t=e.o>=TODAY?e.o:e.c&&e.c>=TODAY?e.c:null;if(t&&t<a)a=floorHour(t)}
    if(a<TODAY)a=TODAY}
  if(NOW-a<4*H)a=floorHour(new Date(NOW-4*H));
  return[a,NOW];
}
// Words only for what the marks and the idle column can't say.
function statusText(e){
  if(e.c)return e.state;
  if(e.agent&&e.agent.state==="waiting")return `waiting ${dur(new Date(e.agent.last_seen),NOW).split(" ")[0]}`;
  return e.agent&&e.agent.state?e.status:"";
}
const ago=ms=>ms<H?`${Math.max(1,Math.round(ms/6e4))}m`:ms<2*DAY?`${Math.floor(ms/H)}h`:`${Math.floor(ms/DAY)}d`;
// The idle column: how long since anything happened, or when it ended.
function gutter(e){
  if(e.c)return `<div class="gut c ${e.state}" title="${esc(e.state)} ${esc(full(e.c))}">${e.state==="merged"?"✓":"✗"} ${esc(win==="window"&&!sameDay(e.c,NOW)?when(e.c):hm(e.c))}</div>`;
  const k=kind(e),i=idle(e);
  return `<div class="gut${k==="running"||k==="needs"?" c "+k:i>=3*H?" long":""}" title="No activity for ${esc(dur(new Date(e.last_activity),NOW))}">${ago(i)}</div>`;
}
// Small copies of the lane marks, for section headings and the legend.
const G={done:`<i class="pt end merged" style="left:11px">✓</i>`,closed:`<i class="pt end closed" style="left:11px">✗</i>`,
  moving:`<i class="span running" style="left:0;width:22px"></i>`,needs:`<i class="span needs" style="left:0;width:22px"></i>`,
  stalled:`<i class="span open" style="left:0;width:9px"></i><i class="tail" style="left:11px;width:11px"></i>`,
  idle:`<i class="tail" style="left:0;width:22px"></i>`,quiet:`<i class="tail" style="left:0;width:22px;opacity:.5"></i>`,
  opened:`<i class="pt open" style="left:11px"></i>`,last:`<i class="pt fill open" style="left:11px"></i>`,carry:`<i class="carry open" style="left:7px"></i>`};
const glyph=k=>`<span class="g" aria-hidden="true">${G[k]}</span>`;
const title=t=>{const m=/^(\w+(?:\([^)]*\))?!?):\s*(?=\S)/.exec(t);return m?`<span class="pre">${esc(m[1])}</span> ${esc(t.slice(m[0].length))}`:esc(t)};
function render(){
  const list=rows(),[A,B]=range(list),X=t=>Math.max(0,Math.min(1,(t-A)/(B-A)))*100;
  document.getElementById("title").textContent=win==="window"?D.label:sameDay(OPENED,NOW)?`Today (${DAYNAME})`:DAYNAME;
  const all=E.filter(inWindow),n=f=>all.filter(f).length,quiet=n(e=>e.group==="quiet"),asks=n(fresh);
  document.getElementById("sum").innerHTML=
    (STALE?`<span class="chip snap">Snapshot from ${esc(hm(NOW))}, ${esc(dur(NOW,OPENED))} old · run <code>provenance recap --html</code> again</span>`:"")+
    `<span class="chip"><b>${all.length}</b> PRs</span>`+
    [["merged",e=>e.state==="merged"],["closed",e=>e.state==="closed"],["open",e=>e.state==="open"]].filter(([,f])=>n(f)).map(([w,f])=>`<span class="chip"><b>${n(f)}</b> ${w}</span>`).join("")+
    (asks?`<span class="chip needs">⚑ <b>${asks}</b> need${asks===1?"s":""} you</span>`:`<span class="chip ok">✓ Nothing new needs you</span>`)+
    (quiet?`<button class="chip quiet" id="quiet">${showQuiet?"Hide":"Show"} ${quiet} gone quiet (no activity for ${esc(D.stale_days)}+ days)</button>`:"");
  const chart=document.getElementById("chart");
  if(!list.length){chart.innerHTML=`<div class="empty">${all.length?"Only PRs that have gone quiet: show them above.":"No open PRs, and none merged or closed in this window."}</div>`;return}
  const css=getComputedStyle(chart),lane=Math.max(200,chart.clientWidth-parseInt(css.getPropertyValue("--lab"))-parseInt(css.getPropertyValue("--gut")));
  let ticks="",bg="";
  const span=(B-A)/H;
  if(span<=36){const step=span/(lane/60)>1?2:1;
    for(let d=ceilHour(A),next;d<=B;d=next){next=at(d,0,d.getHours()+step);if(next<=d)next=new Date(d.getTime()+step*H);if(X(d)>95)continue;ticks+=`<div class="tick" style="left:${X(d)}%">${String(d.getHours()).padStart(2,"0")}:00</div>`;bg+=`<div class="gl" style="left:${X(d)}%"></div>`}}
  else{let days=0;while(at(A,days,0)<B)days++;
    const step=Math.max(1,Math.ceil(days/Math.floor(lane/58)));
    for(let i=0;i<days;i++){const d0=at(A,i,0),noon=at(d0,0,12),morning=at(d0,0,8),evening=at(d0,0,20),next=at(d0,1,0);
      if(days<=31)bg+=`<div class="night" style="left:${X(d0)}%;width:${X(morning)-X(d0)}%"></div><div class="night" style="left:${X(evening)}%;width:${X(next)-X(evening)}%"></div>`;
      if(i%step)continue;
      const we=d0.getDay()===0||d0.getDay()===6;
      ticks+=`<div class="tick${we?" we":""}" style="left:${X(step>1?d0:noon)}%">${DN[d0.getDay()]} ${d0.getDate()}${d0.getDate()===1||i===0&&days>7?" "+MN[d0.getMonth()]:""}</div>`;
      bg+=`<div class="gl" style="left:${X(d0)}%"></div>`}}
  bg+=`<div class="now" style="left:100%"></div>`;
  const row=e=>{const k=kind(e),la=new Date(e.last_activity),carry=e.o<A,l=X(e.o);
    // Ended, or its agent is running: one bar to the end or to now. Otherwise
    // the bar stops at the last activity and dots run on to now.
    const live=!e.c&&e.status==="running",still=!e.c&&!live,r=e.c?X(e.c):live?100:Math.max(l,X(la));
    let marks=r>l?`<i class="span" style="left:${l}%;width:${r-l}%"></i>`:"";
    if(still)marks+=`<i class="tail" style="left:${r}%;width:${100-r}%"></i>`;
    if(carry)marks+=`<i class="carry${still&&la<A?" dim":""}"></i>`;
    else if(r-l>3||live)marks+=`<i class="pt" style="left:${l}%"></i>`;
    if(e.c)marks+=`<i class="pt end" style="left:${r}%">${k==="merged"?"✓":"✗"}</i>`;
    else if(still&&la>=A)marks+=`<i class="pt fill" style="left:${r}%"></i>`;
    if(carry&&still&&la<A)marks+=`<span class="note">last activity ${esc(when(la))}</span>`;
    const st=statusText(e),who=grp==="pr"?" · "+esc(e.agent?e.agent.name:"no session"):"";
    const tip=`Opened ${full(e.o)}${e.c?` · ${e.state} ${full(e.c)}`:""} · last activity ${full(la)}`;
    return `<div class="row ${k}${e.key===sel?" sel":""}" data-key="${esc(e.key)}" aria-expanded="${e.key===sel}"><div class="lab"><div class="l1">${title(e.title)}</div><div class="l2">${st?`<span class="st ${k}">${esc(st)}</span> · `:""}<span class="ref">${esc(short(e))}</span>${who} · opened ${esc(when(e.o))}</div></div><div class="lane" title="${esc(tip)}">${marks}</div>${gutter(e)}</div>${e.key===sel?panel(e):""}`};
  let body="";
  // Needs you, Done and Gone quiet match the terminal. Open PRs split by how
  // recently anything happened on them; long sections show their newest few.
  if(grp==="pr"){
    const open=e=>e.group==="in-flight";
    const secs=[["needs","Needs you",fresh,Infinity],
      ["done",win==="today"||D.days===1?"Done today":"Done",e=>e.state!=="open",6,"done"],
      ["moving","Moving",e=>open(e)&&moving(e),Infinity,"moving","agent running or activity in the last hour"],
      ["stalled","Stalled",e=>open(e)&&!moving(e)&&idle(e)<DAY,8,"stalled","no activity for an hour or more"],
      ["idle","Idle",e=>open(e)&&!moving(e)&&idle(e)>=DAY,5,"idle","no activity for a day or more"],
      ["quiet","Gone quiet",e=>e.group==="quiet",5,"quiet",`no activity for ${esc(D.stale_days)}+ days`]];
    // Asks older than the stale cutoff don't count, and fold away under the fresh ones.
    const olds=list.filter(e=>e.old_ask);
    for(const [id,name,f,cap,g,hint] of secs){const items=list.filter(f);
      if(id==="needs"){if(items.length||olds.length)body+=needs(items,olds);continue}
      if(!items.length)continue;
      const shown=expanded.has(id)?items:items.slice(0,cap);
      body+=`<div class="sec">${glyph(g)}${name}<span class="m">${items.length}</span>${hint?`<span class="h">${hint}</span>`:""}</div>`+shown.map(row).join("")+
        (shown.length<items.length?`<button class="more" data-more="${id}">Show ${items.length-shown.length} more${id==="done"?"":id==="quiet"?" with no recent activity":", most recently active first"}</button>`:"");}}
  else{const order=[...new Set(list.map(sessionKey))];
    for(const s of order){const es=list.filter(e=>sessionKey(e)===s),a=es[0].agent;
      const head=a?`${esc(a.name)}<span class="m">${esc([a.app,a.machine&&"on "+a.machine,a.session_id.slice(0,8)+"…"].filter(Boolean).join(" · "))}</span>${a.state?` <span class="m">· ${esc(a.state.replace("-"," "))}</span>`:""}`:`No session found <span class="m">(likely you)</span>`;
      body+=`<div class="grp">${head}</div>`+es.map(row).join("")}}
  function needs(items,olds){
    const open=expanded.has("old");
    // Newest first, so the first old ask has waited the least.
    const note=olds.length?`${olds.length} older ask${olds.length===1?"":"s"}, waiting ${esc(dur(new Date(olds[0].agent.last_seen),NOW).split(" ")[0])}+`:"";
    const toggle=`<button data-more="old">${open?"Hide":"Show"}</button>`;
    return `<div class="sec needs">${glyph("needs")}Needs you<span class="m">${items.length?items.length:`nothing new · ${note}${toggle}`}</span></div>`+items.map(row).join("")+
      (olds.length&&items.length?`<button class="more" data-more="old">${open?"Hide":"Show"} ${note}</button>`:"")+
      (olds.length&&open?`<div class="sub">Waiting over ${esc(D.stale_days)} days: still yours to answer, or close them</div>`+olds.map(row).join(""):"");
  }
  chart.innerHTML=`<div class="bg">${bg}</div><div class="axis"><div></div><div class="ticks">${ticks}</div><div class="gh">${STALE?"snapshot":"now"} ${hm(NOW)}</div></div>${body}`;
}
// The open row's details and what you can do next, shown under the row.
function panel(e){
  const k=kind(e),a=e.agent;
  const url=/^https:\/\/github\.com\//.test(e.url)?e.url:"";
  const copy=(cmd,label)=>`<button class="btn" data-copy="${esc(cmd)}">${label} <code>${esc(cmd)}</code></button>`;
  const said=a&&a.last_message?`<div class="said-h">${e.group==="needs-you"?`Last message · ${esc(dur(new Date(a.last_seen),NOW))} ago`:"Last message"}</div><div class="said">${esc(a.last_message)}</div>`:"";
  return `<div class="panel"><div class="info"><h2><span class="ref">${esc(e.key)}</span>${esc(e.title)}</h2>
  <div class="m">${a?esc([a.name,a.app,a.machine&&"on "+a.machine,"session "+a.session_id.slice(0,8)+"…",a.matched_by==="stamp"?"stamped":"matched by branch"].filter(Boolean).join(" · ")):"No session found (likely you)"}${statusText(e)?` · <span class="st ${k}">${esc(statusText(e))}</span>`:""}</div>
  ${said}
  <div class="m">Opened ${esc(full(e.o))}${e.c?` · ${esc(e.state)} ${esc(full(e.c))} (${esc(dur(e.o,e.c))})`:` · open for ${esc(dur(e.o,NOW))}`} · last activity ${esc(full(new Date(e.last_activity)))}</div></div>
  <div class="acts">${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open PR ↗</a>`:""}${a?copy(`provenance go ${e.key}`,"Copy"):""}${e.state==="open"?copy(`gh pr close ${e.number} -R ${e.repo}`,"Copy"):""}</div></div>`;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest(".seg button");
  if(b){b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));if(b.parentElement.id==="win")win=b.dataset.v;else grp=b.dataset.v;render();return}
  if(ev.target.closest("#quiet")){showQuiet=!showQuiet;render();return}
  const m=ev.target.closest("[data-more]");if(m){const v=m.dataset.more;v==="old"&&expanded.has(v)?expanded.delete(v):expanded.add(v);render();return}
  const c=ev.target.closest("[data-copy]");
  if(c){navigator.clipboard&&navigator.clipboard.writeText(c.dataset.copy).then(()=>{c.firstChild.textContent="Copied "},()=>{});return}
  // Clicking a row opens its panel; clicking it again closes it.
  const r=ev.target.closest(".row");if(r){sel=sel===r.dataset.key?null:r.dataset.key;render()}});
addEventListener("resize",render);
document.getElementById("legend").innerHTML=[["done","merged"],["closed","closed"],["moving","moving"],["needs","needs you"],
  ["opened","opened"],["last","last activity"],["idle","no activity since"],["carry","opened before the chart starts"]]
  .map(([g,w])=>`<span>${glyph(g)}${w}</span>`).join("")+`<span>right column: time since the last activity</span>${D.days>1?"<span>shaded: night (20:00–08:00)</span>":""}`;
render();
</script>
