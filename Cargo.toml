[package]
name = "provenance"
version = "0.1.0"
edition = "2024"
description = "Find the coding-agent session behind each pull request"
license = "MIT OR Apache-2.0"
repository = "https://github.com/singular-machines/provenance"
readme = "README.md"
keywords = ["claude-code", "codex", "github", "pull-request", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
terminal_size = "0.4.4"
unicode-width = "0.2.3"
